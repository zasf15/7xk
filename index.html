<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title> <!-- تمويه اسم التبويبة -->
  <link rel="icon" href="https://www.google.com/favicon.ico">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --accent: #38bdf8;
      --text: #cbd5e1;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }
    
    .card { 
      width: 100%; 
      max-width: 450px; 
      padding: 30px; 
      background: var(--card-bg); 
      border-radius: 16px; 
      border: 1px solid var(--border); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      text-align: center;
    }
    
    h1 { 
      color: var(--accent); 
      letter-spacing: 2px; 
      margin-bottom: 10px; 
      font-size: 2em; 
      text-transform: uppercase; 
    }
    
    p { 
      margin-bottom: 25px; 
      font-size: 0.9em; 
      color: #94a3b8; 
    }
    
    .input-group { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-bottom: 25px; 
    }
    
    input { 
      width: 100%; 
      padding: 15px; 
      background: var(--bg); 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      color: white; 
      outline: none; 
      font-size: 1em; 
      direction: ltr; 
      text-align: center;
    }
    
    input:focus { border-color: var(--accent); }
    
    button { 
      padding: 14px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 1em;
      cursor: pointer; 
      transition: 0.2s; 
    }
    
    .btn-proxy { background: var(--accent); color: #000; }
    .btn-proxy:hover { background: #0ea5e9; transform: scale(0.98); }
    
    .btn-direct { background: #1e293b; color: white; border: 1px solid var(--border); }
    .btn-direct:hover { background: #334155; transform: scale(0.98); }
    
    .apps-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 10px; 
    }

    .divider {
      margin: 20px 0;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    
    .divider span {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      padding: 0 10px;
      font-size: 0.8em;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>KSR Launcher</h1>
    <p>بوابة التشغيل السريعة - بدون إطارات</p>
    
    <div class="input-group">
      <input type="text" id="url-input" placeholder="https://tiktok.com">
      <button class="btn-proxy" onclick="launchSite(true)">فتح عبر وسيط جوجل (لفك الحظر)</button>
      <button class="btn-direct" onclick="launchSite(false)">فتح برابط مباشر</button>
    </div>

    <div class="divider"><span>التطبيقات السريعة</span></div>

    <div class="apps-grid">
      <button class="btn-proxy" onclick="document.getElementById('url-input').value='https://www.tiktok.com'; launchSite(true)">TikTok (وسيط)</button>
      <button class="btn-proxy" onclick="document.getElementById('url-input').value='https://discord.com/app'; launchSite(true)">Discord (وسيط)</button>
      
      <!-- واتساب وتليجرام محطوطة كرابط مباشر لأن الوسيط يكسر المحادثات -->
      <button class="btn-direct" onclick="document.getElementById('url-input').value='https://web.telegram.org/k/'; launchSite(false)">Telegram</button>
      <button class="btn-direct" onclick="document.getElementById('url-input').value='https://web.whatsapp.com'; launchSite(false)">WhatsApp</button>
    </div>
  </div>

  <script>
    function launchSite(useGoogleProxy) {
      let url = document.getElementById('url-input').value.trim();
      if (!url) return alert("اكتب الرابط أولاً");
      
      if (!url.startsWith('http')) {
        url = 'https://' + url;
      }

      let finalUrl = url;
      
      if (useGoogleProxy) {
        // تمرير الرابط عبر سيرفرات جوجل للترجمة كصفحة كاملة لتخطي الحظر
        finalUrl = `https://translate.google.com/translate?sl=auto&tl=ar&u=${encodeURIComponent(url)}`;
      }

      // فتح الموقع في نفس الصفحة (أو نافذة جديدة) بدل الـ iframe لتجنب رسالة الخطأ
      window.location.href = finalUrl;
    }
  </script>
</body>
</html>
